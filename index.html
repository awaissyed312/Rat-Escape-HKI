  body { font-family: 'Fredoka', system-ui, sans-serif; background:#020617; color:#f8fafc;
         touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #gameCanvas { touch-action: none; display:block; }
  .icon { width: 1.05em; height: 1.05em; display:inline-block; vertical-align: -0.15em; }
  .hud-pill { background:#1e293b; border:1px solid #334155; border-radius:.75rem; padding:.35rem .6rem; display:flex; align-items:center; gap:.35rem; white-space:nowrap; }
  .tbtn { width:2.4rem; height:2.4rem; border-radius:.75rem; display:flex; align-items:center; justify-content:center;
          background:#1e293b; border:1px solid #334155; color:#cbd5e1; transition: background .15s, transform .1s; }
  .tbtn:hover { background:#334155; } .tbtn:active { transform: scale(.94); }
  .dpad button { width:3.6rem; height:3.6rem; border-radius:1rem; background:#1e293b; border:1px solid #334155; color:#fbbf24;
                 font-size:1.4rem; display:flex; align-items:center; justify-content:center; }
  .dpad button:active { background:#334155; transform: scale(.95); }
  .hidden { display:none !important; }
  #board { width: min(100%, max(260px, calc(100dvh - 150px))); }
  @media (pointer: coarse) {
    #board { width: min(100%, max(240px, calc(100dvh - 330px))); }
    .dpad button { width:3.1rem; height:3.1rem; }
    #legend { display:none; }
  }
  @keyframes pop { 0%{transform:scale(.85);opacity:0} 100%{transform:scale(1);opacity:1} }
  .pop { animation: pop .25s ease-out; }

<body class="min-h-screen flex flex-col items-center p-2 sm:p-4">

<header class="w-full max-w-[560px] flex flex-wrap items-center justify-between gap-2 mb-2 p-2.5 bg-slate-900 rounded-2xl border border-slate-800 shadow-lg">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-xl">🐀</div>
    <div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 via-orange-300 to-emerald-400 bg-clip-text text-transparent leading-tight">Rat Escape</h1>
      <p id="level-name" class="text-xs text-slate-400 leading-tight">First Steps</p>
    </div>
  </div>
  <div class="flex items-center gap-1">
    <button id="pause-btn" class="tbtn text-amber-400" title="Pause (P / Space)" aria-label="Pause">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
    <button id="sound-btn" class="tbtn" title="Toggle sound (M)" aria-label="Toggle sound"></button>
    <button id="level-select-btn" class="tbtn" title="Select level" aria-label="Select level">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
    </button>
    <button id="restart-btn" class="tbtn !bg-amber-600 hover:!bg-amber-500 !text-white !border-amber-500" title="Restart level (R)" aria-label="Restart level">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.35-5.65"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
</header>

<div class="w-full max-w-[560px] flex items-center justify-between gap-1.5 mb-2 text-xs sm:text-sm">
  <div class="hud-pill"><span>🗺️</span><span class="text-slate-400 hidden sm:inline">Level</span><b id="level-display" class="text-amber-400">1/10</b></div>
  <div class="hud-pill"><span>🧀</span><b id="cheese-display" class="text-yellow-300">0/0</b></div>
  <div class="hud-pill"><span>👣</span><b id="moves-display" class="text-sky-400">0</b></div>
  <div class="hud-pill"><span>⏱️</span><b id="timer-display" class="text-emerald-400">00:00</b></div>
</div>

<main class="w-full max-w-[560px] flex flex-col items-center">
  <div id="board" class="relative aspect-square bg-slate-900 rounded-2xl border-2 border-slate-800 overflow-hidden shadow-2xl">
    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full cursor-pointer"></canvas>

    <div id="game-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
      <div class="pop flex flex-col items-center" id="overlay-card">
        <div id="overlay-icon" class="text-6xl mb-2">🐀</div>
        <h2 id="overlay-title" class="text-2xl sm:text-3xl font-bold text-amber-400 mb-2">Help the Rat Escape!</h2>
        <div id="overlay-stars" class="mb-2 hidden"></div>
        <p id="overlay-msg" class="text-slate-300 text-sm sm:text-base max-w-sm mb-5"></p>
        <div class="flex gap-3 flex-wrap justify-center">
          <button id="overlay-primary" class="px-7 py-3 bg-gradient-to-r from-amber-500 to-emerald-500 hover:from-amber-400 hover:to-emerald-400 text-slate-950 font-bold text-lg rounded-xl shadow-lg transition hover:scale-105">Start Game</button>
          <button id="overlay-secondary" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold text-lg rounded-xl shadow-lg transition hidden">Restart</button>
        </div>
        <p class="text-[11px] text-slate-500 mt-4 hidden sm:block">Enter = continue · P / Space = pause · R = restart · M = mute</p>
      </div>
    </div>
  </div>

  <!-- On-screen D-pad (touch devices) -->
  <div id="dpad" class="dpad grid grid-cols-3 gap-2 mt-3">
    <div></div><button data-dir="up" aria-label="Up">▲</button><div></div>
    <button data-dir="left" aria-label="Left">◀</button><div></div><button data-dir="right" aria-label="Right">▶</button>
    <div></div><button data-dir="down" aria-label="Down">▼</button><div></div>
  </div>

  <div id="legend" class="w-full mt-3 p-2.5 bg-slate-900/60 rounded-xl border border-slate-800/80 flex flex-wrap items-center justify-around text-xs text-slate-400 gap-2">
    <span>🐀 You</span><span>🧀 Collect all cheese</span><span>🕳️ Hole opens after</span><span>🐍 Avoid the snake</span>
  </div>
</main>

<div id="level-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 shadow-2xl pop">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-xl font-bold text-amber-400">🗺️ Select Level</h3>
      <button id="close-modal-btn" class="tbtn" aria-label="Close">✕</button>
    </div>
    <div id="levels-grid" class="grid grid-cols-5 gap-2.5 my-3"></div>
    <p class="text-xs text-slate-400 text-center">Clear a maze to unlock the next one. Fewer moves = more stars.</p>
  </div>
</div>

<script>
/* ----------------------------- Sound ----------------------------- */
class SoundEngine {
  constructor() { this.ctx = null; this.muted = false; this.lastHiss = 0; }

/* ----------------------------- Game ----------------------------- */
class RatEscapeGame {
  constructor() {
    this.canvas = $('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.levelIdx = 0;
    this.unlocked = Math.min(store.get('unlocked', 0), LEVELS.length - 1);
    this.stars = store.get('stars', {});
    audio.muted = store.get('muted', false);
    this.state = 'START';            // START, PLAYING, PAUSED, WIN, GAMEOVER
    this.inputQueue = [];
    this.lastFrame = performance.now();
    this.particles = [];
    this.shake = 0;

    this.loadLevel(Math.min(store.get('lastLevel', 0), this.unlocked));
    this.bindUI();
    this.updateSoundIcon();
    this.showOverlay('START');
    new ResizeObserver(() => this.resize()).observe($('board'));
    this.resize();
    requestAnimationFrame(t => this.loop(t));
  }

  /* ---------- setup ---------- */
  loadLevel(idx) {
    this.levelIdx = idx;
    const L = LEVELS[idx];
    this.level = L;
    this.n = L.map.length;
    this.grid = []; this.cheese = [];
    let snakeStart = null;
    L.map.forEach((row, r) => {
      this.grid.push([...row].map((ch, c) => {
        if (ch === 'R') this.rat = { r, c };
        else if (ch === 'H') this.hole = { r, c };
        else if (ch === 'S') snakeStart = { r, c };
        else if (ch === 'C') this.cheese.push({ r, c });
        return ch === '#' ? 1 : 0;
      }));
    });
    this.totalCheese = this.cheese.length;
    this.snake = Array.from({ length: L.length }, () => ({ ...snakeStart }));
    this.snakePrev = this.snake.map(s => ({ ...s }));
    this.snakeDir = [0, -1];
    this.snakeAwake = false;
    this.snakeAcc = 0;
    this.snakeAnim = 1;
    this.ratPrev = { ...this.rat };
    this.ratAnim = 1;
    this.ratAngle = 0;
    this.moveCooldown = 0;
    this.moves = 0;
    this.time = 0;
    this.inputQueue = [];
    this.particles = [];
    this.caughtAt = null;
    this.par = this.computePar();
    store.set('lastLevel', idx);
    this.updateHUD();
  }

  computePar() {
    const dist = (a, b) => { const p = this.bfs(a, b, () => false); return p ? p.length : 0; };
    const pts = this.cheese;
    const perms = a => a.length <= 1 ? [a] : a.flatMap((x, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).map(p => [x, ...p]));
    return Math.min(...perms(pts).map(order => {
      let s = 0, cur = this.rat; for (const p of [...order, this.hole]) { s += dist(cur, p); cur = p; } return s;
    }));
  }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    const size = Math.max(1, Math.floor(Math.min(rect.width, rect.height)));
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = size * dpr; this.canvas.height = size * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.size = size;
  }

  /* ---------- UI ---------- */
  bindUI() {
    $('overlay-primary').addEventListener('click', () => { audio.init(); this.primaryAction(); });
    $('overlay-secondary').addEventListener('click', () => { audio.init(); this.secondaryAction(); });
    $('pause-btn').addEventListener('click', () => this.togglePause());
    $('restart-btn').addEventListener('click', () => { audio.init(); this.restart(); });
    $('sound-btn').addEventListener('click', () => this.toggleSound());
    $('level-select-btn').addEventListener('click', () => this.openLevelModal());
    $('close-modal-btn').addEventListener('click', () => this.closeLevelModal());
    $('level-modal').addEventListener('click', e => { if (e.target.id === 'level-modal') this.closeLevelModal(); });

    window.addEventListener('keydown', e => {
      const k = e.key;
      const map = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
                    ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
      if (map[k] || k === ' ') e.preventDefault();          // stop the page from scrolling
      if (!$('level-modal').classList.contains('hidden')) { if (k === 'Escape') this.closeLevelModal(); return; }
      if (map[k]) { this.queueMove(map[k]); return; }
      if (k === 'p' || k === 'P' || k === ' ' || k === 'Escape') { this.togglePause(); return; }
      if (k === 'r' || k === 'R') { audio.init(); this.restart(); return; }
      if (k === 'm' || k === 'M') { this.toggleSound(); return; }
      if (k === 'Enter' && !$('game-overlay').classList.contains('hidden')) { e.preventDefault(); audio.init(); this.primaryAction(); }
    });

    // Pointer: swipe anywhere, or tap toward the direction you want to go
    let start = null;
    this.canvas.addEventListener('pointerdown', e => { start = { x: e.clientX, y: e.clientY }; });
    this.canvas.addEventListener('pointerup', e => {
      if (!start) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y; start = null;
      if (this.state !== 'PLAYING') return;
      audio.init();
      if (Math.hypot(dx, dy) > 24) { this.queueMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); return; }
      const rect = this.canvas.getBoundingClientRect(), cell = rect.width / this.n;
      const tx = (e.clientX - rect.left) / cell - (this.rat.c + 0.5);
      const ty = (e.clientY - rect.top) / cell - (this.rat.r + 0.5);
      if (Math.abs(tx) < 0.5 && Math.abs(ty) < 0.5) return;  // tapped the rat itself
      this.queueMove(Math.abs(tx) > Math.abs(ty) ? (tx > 0 ? 'right' : 'left') : (ty > 0 ? 'down' : 'up'));
    });
    this.canvas.addEventListener('pointercancel', () => { start = null; });

    document.querySelectorAll('#dpad button').forEach(b => {
      b.addEventListener('pointerdown', e => { e.preventDefault(); audio.init(); this.queueMove(b.dataset.dir); });
    });
    if (!matchMedia('(pointer: coarse)').matches) $('dpad').classList.add('hidden');

    // Auto-pause when the tab/window loses focus
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'PLAYING') this.pause(); });
    window.addEventListener('blur', () => { if (this.state === 'PLAYING') this.pause(); });
  }

  updateHUD() {
    $('level-display').textContent = `${this.levelIdx + 1}/${LEVELS.length}`;
    $('level-name').textContent = this.level.name;
    $('cheese-display').textContent = `${this.totalCheese - this.cheese.length}/${this.totalCheese}`;
    $('moves-display').textContent = this.moves;
    $('timer-display').textContent = fmtTime(this.time);
  }

  updateSoundIcon() {
    $('sound-btn').innerHTML = audio.muted
      ? '<svg class="icon text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
      : '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13"/></svg>';
  }
  toggleSound() { audio.muted = !audio.muted; store.set('muted', audio.muted); if (!audio.muted) audio.init(); this.updateSoundIcon(); }

  showOverlay(kind, extra = {}) {
    const o = {
      START:   { icon: '🐀', title: 'Help the Rat Escape!', color: 'text-amber-400',
                 msg: 'Grab every 🧀 to open the burrow, then dive in before the snake catches you. The snake sleeps until your first move. Use arrow keys / WASD, swipe, or tap.',
                 primary: 'Start Game' },
      PAUSED:  { icon: '⏸️', title: 'Paused', color: 'text-sky-400', msg: 'Take a breather. The snake is waiting…', primary: 'Resume', secondary: 'Restart' },
      WIN:     { icon: '🎉', title: 'Level Cleared!', color: 'text-emerald-400', msg: extra.msg,
                 primary: this.levelIdx < LEVELS.length - 1 ? 'Next Level' : 'Finish', secondary: 'Replay' },
      DONE:    { icon: '🏆', title: 'You Escaped Them All!', color: 'text-amber-300', msg: extra.msg, primary: 'Play Again', secondary: 'Levels' },
      GAMEOVER:{ icon: '🐍', title: 'Caught by the Snake!', color: 'text-rose-400', msg: extra.msg || 'So close! Watch the snake’s path and use the loops to slip past it.', primary: 'Try Again', secondary: 'Levels' },
    }[kind];
    this.overlayKind = kind;
    $('overlay-icon').textContent = o.icon;
    $('overlay-title').textContent = o.title;
    $('overlay-title').className = `text-2xl sm:text-3xl font-bold mb-2 ${o.color}`;
    $('overlay-msg').textContent = o.msg;
    $('overlay-primary').textContent = o.primary;
    $('overlay-secondary').textContent = o.secondary || '';
    $('overlay-secondary').classList.toggle('hidden', !o.secondary);
    const starsEl = $('overlay-stars');
    if (extra.stars) {
      starsEl.innerHTML = [1, 2, 3].map(i => `<span class="star ${i <= extra.stars ? '' : 'off'}">⭐</span>`).join('');
      starsEl.classList.remove('hidden');
    } else starsEl.classList.add('hidden');
    const card = $('overlay-card'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
    $('game-overlay').classList.remove('hidden');
  }
  hideOverlay() { $('game-overlay').classList.add('hidden'); }

  primaryAction() {
    switch (this.overlayKind) {
      case 'START': case 'GAMEOVER': this.restart(); break;
      case 'PAUSED': this.resume(); break;
      case 'WIN':
        if (this.levelIdx < LEVELS.length - 1) { this.loadLevel(this.levelIdx + 1); this.begin(); }
        else this.showOverlay('DONE', { msg: `All ${LEVELS.length} mazes cleared with ${this.totalStars()} of ${LEVELS.length * 3} stars. Go back for any you missed!` });
        break;
      case 'DONE': this.loadLevel(0); this.begin(); break;
    }
  }
  secondaryAction() {
    switch (this.overlayKind) {
      case 'PAUSED': case 'WIN': this.restart(); break;
      case 'GAMEOVER': case 'DONE': this.openLevelModal(); break;
    }
  }

  /* ---------- state ---------- */
  begin() { this.state = 'PLAYING'; this.hideOverlay(); this.lastFrame = performance.now(); }
  restart() { this.loadLevel(this.levelIdx); this.begin(); }
  pause() { if (this.state !== 'PLAYING') return; this.state = 'PAUSED'; this.showOverlay('PAUSED'); }
  resume() { if (this.state !== 'PAUSED') return; this.begin(); }
  togglePause() { if (this.state === 'PLAYING') this.pause(); else if (this.state === 'PAUSED') this.resume(); }

  queueMove(dir) {
    if (this.state !== 'PLAYING') return;
    if (this.inputQueue.length < 2) this.inputQueue.push(DIRS[dir]);
  }

  isWall(r, c) { return r < 0 || c < 0 || r >= this.n || c >= this.n || this.grid[r][c] === 1; }

  moveRat([dr, dc]) {
    const tr = this.rat.r + dr, tc = this.rat.c + dc;
    if (this.isWall(tr, tc)) { audio.bump(); return; }
    this.ratPrev = { ...this.rat };
    this.rat = { r: tr, c: tc };
    this.ratAnim = 0;
    this.ratAngle = Math.atan2(dr, dc);
    this.moves++;
    this.moveCooldown = 95;
    audio.step();
    if (!this.snakeAwake) { this.snakeAwake = true; this.snakeAcc = 0; }

    // cheese
    const ci = this.cheese.findIndex(ch => eq(ch, this.rat));
    if (ci >= 0) {
      this.cheese.splice(ci, 1);
      this.burst(this.rat, '#fde047', 14);
      if (this.cheese.length === 0) { audio.unlock(); this.burst(this.hole, '#34d399', 24); }
      else audio.cheese();
    }
    this.updateHUD();

    // win: open hole beats everything (you dive in under the snake)
    if (this.cheese.length === 0 && eq(this.rat, this.hole)) { this.win(); return; }
    // walked into the snake
    if (this.snake.some(s => eq(s, this.rat))) this.lose();
  }

  bfs(from, to, blocked) {
    const key = p => p.r * 64 + p.c, prev = new Map([[key(from), null]]), q = [from];
    for (let i = 0; i < q.length; i++) {
      const p = q[i];
      if (eq(p, to)) { const path = []; let cur = p; while (prev.get(key(cur))) { path.unshift(cur); cur = prev.get(key(cur)); } return path; }
      for (const [dr, dc] of DIR_LIST) {
        const np = { r: p.r + dr, c: p.c + dc };
        if (this.isWall(np.r, np.c) || prev.has(key(np)) || blocked(np)) continue;
        prev.set(key(np), p); q.push(np);
      }
    }
    return null;
  }

  moveSnake() {
    const head = this.snake[0], neck = this.snake[1];
    // the tail cell frees up as the snake moves, so only the rest of the body blocks
    const body = this.snake.slice(0, -1);
    const blocked = p => body.some(s => eq(s, p));
    let step = null;
    if (Math.random() < this.level.focus) {
      const path = this.bfs(head, this.rat, blocked);
      if (path && path.length) step = path[0];
    }
    if (!step) {   // wander: any open cell, never straight back into its own neck
      const opts = DIR_LIST.map(([dr, dc]) => ({ r: head.r + dr, c: head.c + dc }))
        .filter(p => !this.isWall(p.r, p.c) && !blocked(p) && !(neck && !eq(neck, head) && eq(p, neck)));
      if (opts.length) step = opts[Math.floor(Math.random() * opts.length)];
    }
    if (!step) return;   // boxed in: wait a beat
    this.snakePrev = this.snake.map(s => ({ ...s }));
    this.snakeDir = [step.r - head.r, step.c - head.c];
    this.snake.unshift(step); this.snake.pop();
    this.snakeAnim = 0;

    const d = Math.abs(step.r - this.rat.r) + Math.abs(step.c - this.rat.c);
    if (d <= 3) audio.hiss();
    if (eq(step, this.rat)) this.lose();
  }

  win() {
    this.state = 'WIN';
    audio.win();
    this.burst(this.hole, '#fbbf24', 30);
    const extra = this.moves - this.par;
    const stars = extra <= 4 ? 3 : extra <= 14 ? 2 : 1;
    const prevBest = this.stars[this.levelIdx] || 0;
    if (stars > prevBest) { this.stars[this.levelIdx] = stars; store.set('stars', this.stars); }
    if (this.levelIdx >= this.unlocked && this.levelIdx < LEVELS.length - 1) { this.unlocked = this.levelIdx + 1; store.set('unlocked', this.unlocked); }
    const tip = stars < 3 ? ` Finish in ${this.par + 4} moves or fewer for 3 stars.` : ' Perfect route!';
    this.showOverlay('WIN', { stars, msg: `Escaped in ${this.moves} moves and ${fmtTime(this.time)}.${tip}` });
  }

  lose() {
    this.state = 'GAMEOVER';
    this.caughtAt = { ...this.rat };
    this.shake = 12;
    audio.lose();
    this.burst(this.rat, '#f43f5e', 20);
    setTimeout(() => { if (this.state === 'GAMEOVER') this.showOverlay('GAMEOVER'); }, 650);
  }

  totalStars() { return Object.values(this.stars).reduce((a, b) => a + b, 0); }

  /* ---------- level modal ---------- */
  openLevelModal() {
    if (this.state === 'PLAYING') this.pause();
    const grid = $('levels-grid'); grid.innerHTML = '';
    LEVELS.forEach((L, idx) => {
      const open = idx <= this.unlocked, s = this.stars[idx] || 0;
      const b = document.createElement('button');
      b.className = `h-16 rounded-xl font-bold flex flex-col items-center justify-center transition ${
        open ? (idx === this.levelIdx ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 hover:bg-slate-700 text-amber-400')
             : 'bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed'}`;
      b.title = open ? L.name : 'Locked';
      b.innerHTML = open ? `<span class="text-lg leading-none">${idx + 1}</span><span class="text-[10px] mt-1 tracking-tighter">${'★'.repeat(s)}<span class="opacity-30">${'★'.repeat(3 - s)}</span></span>` : '🔒';
      if (open) b.addEventListener('click', () => { audio.init(); $('level-modal').classList.add('hidden'); this.loadLevel(idx); this.begin(); });
      grid.appendChild(b);
    });
    $('level-modal').classList.remove('hidden');
  }
  closeLevelModal() { $('level-modal').classList.add('hidden'); }

  /* ---------- effects ---------- */
  burst(cell, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 2.2;
      this.particles.push({ x: cell.c + 0.5, y: cell.r + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
    }
  }

  /* ---------- main loop ---------- */
  loop(now) {
    const dt = Math.min(100, now - this.lastFrame);   // clamp so a hiccup can't teleport the snake
    this.lastFrame = now;
    if (this.state === 'PLAYING') this.update(dt);
    this.ratAnim = Math.min(1, this.ratAnim + dt / 90);
    this.snakeAnim = Math.min(1, this.snakeAnim + dt / Math.min(180, this.level.speed * 0.8));
    this.particles.forEach(p => { p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000; p.life -= dt / 700; });
    this.particles = this.particles.filter(p => p.life > 0);
    this.shake = Math.max(0, this.shake - dt / 25);
    this.draw(now);
    requestAnimationFrame(t => this.loop(t));
  }

  update(dt) {
    this.time += dt / 1000;
    $('timer-display').textContent = fmtTime(this.time);
    this.moveCooldown -= dt;
    if (this.moveCooldown <= 0 && this.inputQueue.length) this.moveRat(this.inputQueue.shift());
    if (this.state !== 'PLAYING' || !this.snakeAwake) return;
    this.snakeAcc += dt;
    if (this.snakeAcc >= this.level.speed) { this.snakeAcc -= this.level.speed; this.moveSnake(); }
  }

  /* ---------- drawing ---------- */
  draw(now) {
    const ctx = this.ctx, S = this.size, n = this.n, cs = S / n;
    ctx.save();
    ctx.clearRect(0, 0, S, S);
    if (this.shake > 0) ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    ctx.fillStyle = '#0b1120'; ctx.fillRect(-20, -20, S + 40, S + 40);

    // tiles
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const x = c * cs, y = r * cs;
      ctx.beginPath();
      if (this.grid[r][c] === 1) {
        ctx.fillStyle = '#1e293b'; ctx.roundRect(x + 1.5, y + 1.5, cs - 3, cs - 3, cs * 0.18); ctx.fill();
        ctx.fillStyle = '#273449'; ctx.beginPath(); ctx.roundRect(x + 3, y + 3, cs - 6, (cs - 6) * 0.45, cs * 0.14); ctx.fill();
      } else {
        ctx.fillStyle = (r + c) % 2 ? '#0a101d' : '#0c1424'; ctx.roundRect(x + 1, y + 1, cs - 2, cs - 2, cs * 0.1); ctx.fill();
      }
    }

    // valid-move hints
    if (this.state === 'PLAYING') {
      for (const [dr, dc] of DIR_LIST) {
        const nr = this.rat.r + dr, nc = this.rat.c + dc;
        if (this.isWall(nr, nc)) continue;
        ctx.beginPath(); ctx.roundRect(nc * cs + 3, nr * cs + 3, cs - 6, cs - 6, cs * 0.14);
        ctx.fillStyle = 'rgba(245,158,11,0.16)'; ctx.fill();
        ctx.strokeStyle = 'rgba(251,191,36,0.45)'; ctx.lineWidth = 1.2; ctx.stroke();
      }
    }

    this.drawHole(now, cs);
    this.cheese.forEach(ch => this.drawCheese(ch, now, cs));
    this.drawSnake(now, cs);
    this.drawRat(now, cs);

    // particles
    this.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x * cs, p.y * cs, cs * 0.07 * p.life + 1, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // danger vignette when the snake is close
    if (this.state === 'PLAYING' && this.snakeAwake) {
      const d = Math.abs(this.snake[0].r - this.rat.r) + Math.abs(this.snake[0].c - this.rat.c);
      if (d <= 2) {
        const a = (d === 1 ? 0.35 : 0.18) * (0.75 + 0.25 * Math.sin(now / 90));
        const g = ctx.createRadialGradient(S / 2, S / 2, S * 0.3, S / 2, S / 2, S * 0.75);
        g.addColorStop(0, 'rgba(244,63,94,0)'); g.addColorStop(1, `rgba(244,63,94,${a})`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
      }
    }
    // sleeping-snake hint
    if (this.state === 'PLAYING' && !this.snakeAwake) {
      ctx.font = `600 ${Math.max(12, S * 0.032)}px Fredoka, sans-serif`;
      ctx.textAlign = 'center';
      const txt = 'The snake is asleep 💤 — make your first move!';
      const w = ctx.measureText(txt).width + 24;
      ctx.fillStyle = 'rgba(2,6,23,0.8)'; ctx.beginPath(); ctx.roundRect(S / 2 - w / 2, S - S * 0.1, w, S * 0.065, 10); ctx.fill();
      ctx.fillStyle = '#fde68a'; ctx.fillText(txt, S / 2, S - S * 0.055);
    }
    ctx.restore();
  }

  drawHole(now, cs) {
    const ctx = this.ctx, x = (this.hole.c + 0.5) * cs, y = (this.hole.r + 0.5) * cs, R = cs * 0.34;
    const open = this.cheese.length === 0;
    if (open) {
      const pulse = 1 + 0.12 * Math.sin(now / 200);
      const g = ctx.createRadialGradient(x, y, 1, x, y, R * 1.7 * pulse);
      g.addColorStop(0, 'rgba(16,185,129,0.55)'); g.addColorStop(1, 'rgba(16,185,129,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * 1.7 * pulse, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#2a1f17'; ctx.beginPath(); ctx.arc(x, y, R * 1.15, 0, Math.PI * 2); ctx.fill();
    const pit = ctx.createRadialGradient(x - R * 0.2, y - R * 0.2, 1, x, y, R);
    pit.addColorStop(0, open ? '#064e3b' : '#1f2937'); pit.addColorStop(1, '#000');
    ctx.fillStyle = pit; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = open ? '#34d399' : '#475569'; ctx.lineWidth = 2; ctx.stroke();
    if (!open) {   // locked: little padlock with remaining cheese count
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath(); ctx.roundRect(x - R * 0.38, y - R * 0.05, R * 0.76, R * 0.6, R * 0.12); ctx.fill();
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = Math.max(1.5, R * 0.14);
      ctx.beginPath(); ctx.arc(x, y - R * 0.05, R * 0.25, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#0f172a'; ctx.font = `700 ${R * 0.45}px Fredoka, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(this.cheese.length, x, y + R * 0.27); ctx.textBaseline = 'alphabetic';
    }
  }

  drawCheese(ch, now, cs) {
    const ctx = this.ctx, x = (ch.c + 0.5) * cs, y = (ch.r + 0.5) * cs + Math.sin(now / 300 + ch.c) * cs * 0.04, s = cs * 0.3;
    ctx.save(); ctx.translate(x, y);
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, s * 1.8);
    g.addColorStop(0, 'rgba(253,224,71,0.3)'); g.addColorStop(1, 'rgba(253,224,71,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#a16207'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-s, s * 0.6); ctx.lineTo(s, s * 0.6); ctx.lineTo(s, -s * 0.1); ctx.lineTo(-s, -s * 0.7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ca8a04';
    [[-0.45, 0.2, 0.17], [0.3, 0.25, 0.13], [0.5, -0.05, 0.09], [-0.1, -0.15, 0.1]].forEach(([hx, hy, hr]) => { ctx.beginPath(); ctx.arc(hx * s, hy * s, hr * s, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
  }

  lerpSeg(i) {
    const a = this.snakePrev[i] || this.snake[i], b = this.snake[i], t = this.snakeAnim;
    return { x: (a.c + (b.c - a.c) * t + 0.5), y: (a.r + (b.r - a.r) * t + 0.5) };
  }

  drawSnake(now, cs) {
    const ctx = this.ctx, pts = this.snake.map((_, i) => this.lerpSeg(i));
    const len = pts.length;
    // body: tail to head so the head sits on top
    for (let i = len - 1; i >= 1; i--) {
      const p = pts[i], q = pts[i - 1], w = cs * (0.5 - (i / len) * 0.22);
      ctx.strokeStyle = i % 2 ? '#b91c1c' : '#dc2626'; ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x * cs, p.y * cs); ctx.lineTo(q.x * cs, q.y * cs); ctx.stroke();
      ctx.fillStyle = 'rgba(254,202,202,0.25)';
      ctx.beginPath(); ctx.arc(p.x * cs, p.y * cs, w * 0.2, 0, Math.PI * 2); ctx.fill();
    }
    const h = pts[0], R = cs * 0.3, hx = h.x * cs, hy = h.y * cs;
    const angle = Math.atan2(this.snakeDir[0], this.snakeDir[1]);
    const glow = ctx.createRadialGradient(hx, hy, 1, hx, hy, R * 1.8);
    glow.addColorStop(0, 'rgba(244,63,94,0.4)'); glow.addColorStop(1, 'rgba(244,63,94,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(hx, hy, R * 1.8, 0, Math.PI * 2); ctx.fill();

    ctx.save(); ctx.translate(hx, hy); ctx.rotate(angle);
    // tongue flick
    if (this.snakeAwake && Math.sin(now / 160) > 0) {
      const tl = R * (0.7 + 0.3 * Math.sin(now / 60));
      ctx.strokeStyle = '#fb7185'; ctx.lineWidth = Math.max(1.5, cs * 0.03); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(R * 1.1, 0); ctx.lineTo(R * 1.1 + tl, 0);
      ctx.lineTo(R * 1.1 + tl + R * 0.25, -R * 0.2); ctx.moveTo(R * 1.1 + tl, 0); ctx.lineTo(R * 1.1 + tl + R * 0.25, R * 0.2); ctx.stroke();
    }
    ctx.fillStyle = '#dc2626'; ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(R * 1.2, 0);
    ctx.quadraticCurveTo(R * 0.6, -R * 1.05, -R * 0.7, -R * 0.75); ctx.lineTo(-R * 0.7, R * 0.75);
    ctx.quadraticCurveTo(R * 0.6, R * 1.05, R * 1.2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    const asleep = !this.snakeAwake;
    [-1, 1].forEach(side => {
      if (asleep) {
        ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.arc(R * 0.35, side * R * 0.42, R * 0.18, 0.2, Math.PI - 0.2); ctx.stroke();
      } else {
        ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(R * 0.35, side * R * 0.42, R * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(R * 0.38, side * R * 0.42, R * 0.07, R * 0.17, 0, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.restore();
    if (asleep) {   // floating Zzz
      ctx.fillStyle = 'rgba(226,232,240,0.85)'; ctx.font = `700 ${cs * 0.28}px Fredoka, sans-serif`; ctx.textAlign = 'center';
      const bob = (now / 700) % 1;
      ctx.globalAlpha = 1 - bob; ctx.fillText('z', hx + cs * 0.3, hy - cs * 0.3 - bob * cs * 0.3); ctx.globalAlpha = 1;
    }
  }

  drawRat(now, cs) {
    const ctx = this.ctx, t = this.ratAnim, e = 1 - (1 - t) * (1 - t);
    const cx = (this.ratPrev.c + (this.rat.c - this.ratPrev.c) * e + 0.5) * cs;
    const cy = (this.ratPrev.r + (this.rat.r - this.ratPrev.r) * e + 0.5) * cs;
    const R = cs * 0.3, hop = Math.sin(t * Math.PI) * cs * 0.06;
    const glow = ctx.createRadialGradient(cx, cy, 1, cx, cy, R * 1.6);
    glow.addColorStop(0, 'rgba(251,191,36,0.3)'); glow.addColorStop(1, 'rgba(251,191,36,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R * 1.6, 0, Math.PI * 2); ctx.fill();

    ctx.save(); ctx.translate(cx, cy - hop); ctx.rotate(this.ratAngle);
    if (this.state === 'GAMEOVER') ctx.globalAlpha = 0.55;
    // tail
    const wag = Math.sin(now / 180) * R * 0.3;
    ctx.strokeStyle = '#f9a8d4'; ctx.lineWidth = Math.max(2, cs * 0.04); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-R * 0.7, 0); ctx.quadraticCurveTo(-R * 1.3, wag, -R * 1.7, -wag * 0.6); ctx.stroke();
    // body
    const fur = ctx.createRadialGradient(-R * 0.2, -R * 0.2, 1, 0, 0, R * 1.1);
    fur.addColorStop(0, '#fef3c7'); fur.addColorStop(0.5, '#f59e0b'); fur.addColorStop(1, '#b45309');
    ctx.fillStyle = fur; ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(-R * 0.1, 0, R * 0.85, R * 0.68, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // ears
    ctx.fillStyle = '#f9a8d4';
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(R * 0.3, s * R * 0.55, R * 0.26, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
    // head
    ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(R * 0.55, 0, R * 0.5, R * 0.42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.arc(R * 1.02, 0, R * 0.13, 0, Math.PI * 2); ctx.fill();
    // eyes
    [-1, 1].forEach(s => {
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(R * 0.65, s * R * 0.2, R * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(R * 0.68, s * R * 0.2 - R * 0.03, R * 0.035, 0, Math.PI * 2); ctx.fill();
    });
    // whiskers
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath();
    [-1, 1].forEach(s => { ctx.moveTo(R * 0.9, s * R * 0.08); ctx.lineTo(R * 1.35, s * R * 0.4); ctx.moveTo(R * 0.92, 0); ctx.lineTo(R * 1.45, s * R * 0.14); });
    ctx.stroke();
    ctx.restore();
  }
}

window.addEventListener('load', () => { window.game = new RatEscapeGame(); });
</script>
</body>
